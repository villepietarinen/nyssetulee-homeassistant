name: Home Assistant checks and release package
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/card.test.mjs
      - name: Validate and package integration with bundled card
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/package_homeassistant.py --tag "$RELEASE_TAG"
          else
            python tools/package_homeassistant.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nyssetulee-homeassistant
          path: dist/nyssetulee.zip
      - name: Attach manual-install archive to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/nyssetulee.zip --clobber

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --prefix tests/browser --ignore-scripts
      - run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - run: node tests/browser/publicha.cjs
